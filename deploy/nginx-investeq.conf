    }

    # ---- Project: EMA swing-low scanner (Streamlit on 8501, served at /scan).
    # Streamlit handles its own /scan/ prefix via --server.baseUrlPath, so we
    # forward the path as-is rather than stripping it.

    # Static assets — serve DIRECTLY from disk so they never touch a busy
    # Streamlit. The previous proxy_pass version would 504 whenever Streamlit
    # was saturated, leaving the page unstyled. By pointing root at the wheel's
    # static/ dir and stripping the /scan/ prefix, /scan/static/css/main.css
    # → /home/.../streamlit/static/static/css/main.css on disk.
    location ^~ /scan/static/ {
        alias /home/ajay/investeq_ajs/.venv/lib/python3.11/site-packages/streamlit/static/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
    location = /scan/favicon.png {
        alias /home/ajay/investeq_ajs/.venv/lib/python3.11/site-packages/streamlit/static/favicon.png;
        expires 7d;
        access_log off;
    }

    # Component iframes (AgGrid, lightweight-charts) and _stcore assets
    # still go through Streamlit but bypass the auth_request round-trip.
    location ~ ^/scan/(_stcore/static|component|media|vendor)/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /scan/ {
        auth_request /internal/auth;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
