# /etc/nginx/sites-available/investeq
# enable with: ln -s /etc/nginx/sites-available/investeq /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    # ---- Subrequest target used by auth_request directives below.
    # 200 => let the request through. 401 => trigger error_page below.
    location = /internal/auth {
        internal;
        proxy_pass http://127.0.0.1:8700/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Anything that hits an auth_request 401 redirects to the login page.
    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 /login;
    }

    # ---- Portfolio (login page + dashboard hub). Has its own gate.
    location / {
        proxy_pass http://127.0.0.1:8700;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Project: NIFTY short-straddle replay (FastAPI on 8703).
    location /straddle/ {
        auth_request /internal/auth;
        proxy_pass http://127.0.0.1:8703/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    # ---- Project: option-chain replay (FastAPI on 8704).
    location /chain/ {
